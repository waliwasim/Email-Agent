name: Daily AI News Digest

on:
  schedule:
    # Runs at 07:00 UTC every day = 12:30 PM Pakistan Time (PKT, UTC+5)
    # Edit the hour below if you want a different delivery time.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI news agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      - name: Commit debug log on failure
        if: failure()
        run: |
          if [ -f debug_log.txt ]; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add debug_log.txt
            git commit -m "debug log [skip ci]"
            git push
          fi

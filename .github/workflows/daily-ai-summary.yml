name: Daily AI News Digest

on:
  schedule:
    # Runs at 07:00 UTC every day = 12:30 PM Pakistan Time (PKT, UTC+5)
    # Edit the hour below if you want a different delivery time.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI news agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      - name: Upload debug log via API on failure
        if: failure()
        run: |
          if [ -f debug_log.txt ]; then
            CONTENT=$(base64 -w0 debug_log.txt)
            SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/debug_log.txt" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))")
            if [ -n "$SHA" ]; then
              curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/contents/debug_log.txt" \
                -d "{\"message\":\"debug log\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
            else
              curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/contents/debug_log.txt" \
                -d "{\"message\":\"debug log\",\"content\":\"$CONTENT\"}"
            fi
          else
            echo "No debug_log.txt was produced"
          fi
